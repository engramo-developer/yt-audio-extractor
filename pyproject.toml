[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-audio-extractor"
version = "0.1.0"
description = "Zero-config Python library and CLI to extract audio from YouTube (and other yt-dlp-supported sites)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Volodymyr Dotsenko" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
keywords = ["youtube", "audio", "yt-dlp", "download", "mp3", "extract", "ffmpeg"]
dependencies = [
    "yt-dlp>=2024.1.1",
]

[project.urls]
Homepage = "https://github.com/engramo-developer/yt-audio-extractor"
Repository = "https://github.com/engramo-developer/yt-audio-extractor"
Issues = "https://github.com/engramo-developer/yt-audio-extractor/issues"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
]

[project.scripts]
yt-audio-extractor = "ytaudio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ytaudio"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "yt_dlp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ytaudio"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
